<title>IdleWars</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap">
<style>
/* Layout: a pan-and-zoom hex board on the left, a command panel on the right; the panel stacks under the board on narrow screens. */
:root {
  --bg: #edf0f2;
  --panel: #ffffff;
  --panel-2: #f3f5f7;
  --ink: #17222c;
  --ink-2: #5b6b78;
  --line: #d5dce2;
  --sea: #cfe3ee;
  --btn: #17222c;
  --btn-ink: #ffffff;
  --good: #1f8a52;
  --bad: #c2403a;
  --warn: #b7791f;
  --font-display: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", monospace;
  --font-body: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11171c; --panel: #1a232b; --panel-2: #212c36; --ink: #e7eef3; --ink-2: #93a4b2;
    --line: #2d3a46; --sea: #1b3140; --btn: #e7eef3; --btn-ink: #11171c; --good: #4cc787; --bad: #ef7a73; --warn: #e5b04f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11171c; --panel: #1a232b; --panel-2: #212c36; --ink: #e7eef3; --ink-2: #93a4b2;
  --line: #2d3a46; --sea: #1b3140; --btn: #e7eef3; --btn-ink: #11171c; --good: #4cc787; --bad: #ef7a73; --warn: #e5b04f;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; margin: 0;
  padding-block: 10px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1400px; margin: 0 auto; display: grid; gap: 10px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.hl { display: grid; gap: 4px; min-width: 0; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: 28px; letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
header p { margin: 0; color: var(--ink-2); max-width: 72ch; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--panel); }
.seg button { border: 0; background: transparent; padding: 7px 14px; font-weight: 700; cursor: pointer; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--btn); color: var(--btn-ink); }
.game { display: grid; grid-template-columns: minmax(0, 1fr) 370px; gap: 16px; align-items: start; }
@media (max-width: 0px) { .game { grid-template-columns: minmax(0, 1fr); } }
.stage { position: relative; min-width: 0; display: grid; gap: 10px; }
.board-wrap { position: relative; border-radius: 14px; overflow: hidden; background: var(--sea); border: 1px solid var(--line); height: clamp(380px, 74vh, 860px); }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: pointer; }
canvas.grab { cursor: grabbing; }
.legend { position: absolute; left: max(10px, env(safe-area-inset-left, 0px)); bottom: 10px; max-width: min(260px, 60%); max-height: 46%; overflow: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 3px 10px; background: rgba(10, 18, 26, 0.74); color: #fff; border-radius: 10px; padding: 7px 10px; font-size: 12px; line-height: 1.25; pointer-events: none; }
.legend span { display: flex; align-items: center; gap: 6px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.legend i { width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid #fff; flex: none; }
.legend .out { opacity: 0.45; text-decoration: line-through; }
.cam { position: absolute; top: 10px; right: 10px; display: flex; gap: 6px; }
.cam2 { position: absolute; top: 54px; right: 10px; display: flex; gap: 6px; }
.cam2 button { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; font-weight: 700; font-size: 13px; cursor: pointer; color: var(--ink); }
.cam2 button[aria-pressed="true"] { background: var(--btn); color: var(--btn-ink); }
.cam button { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-weight: 700; cursor: pointer; color: var(--ink); }
.viewbar { display: flex; flex-wrap: wrap; gap: 6px; }
.viewbar button { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; font-weight: 700; cursor: pointer; color: var(--ink); font-size: 13.5px; }
.viewbar button[aria-pressed="true"] { background: var(--btn); color: var(--btn-ink); }
.viewbar button:disabled { opacity: 0.4; cursor: default; }
.hint { min-height: 24px; display: flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: 14px; line-height: 1.3; }
.hint img { width: 22px; height: 22px; flex: none; }
.hint b { font-family: var(--font-display); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 12px; min-width: 0; }
.panel h2 { font-family: var(--font-display); font-size: 15px; margin: 0; letter-spacing: 0.02em; text-transform: uppercase; color: var(--ink-2); }
.turn { display: grid; gap: 8px; }
.turn .line { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.turn .name { font-family: var(--font-display); font-weight: 800; font-size: 19px; display: flex; align-items: center; gap: 8px; min-width: 0; }
.turn .name img { width: 34px; height: 34px; flex: none; }
button, select, input { font: inherit; color: inherit; }
.btn { background: var(--btn); color: var(--btn-ink); border: 0; border-radius: 9px; padding: 10px 16px; font-weight: 700; cursor: pointer; }
.btn:disabled { opacity: 0.35; cursor: default; }
.btn.alt { background: var(--panel-2); color: var(--ink); border: 1px solid var(--line); }
.btn.sm { padding: 6px 12px; font-size: 13.5px; }
button:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible, canvas:focus-visible { outline: 3px solid #4a8df0; outline-offset: 2px; }
.res { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.res div { background: var(--panel-2); border: 1px solid var(--line); border-radius: 9px; padding: 6px 8px; min-width: 0; }
.res small { display: block; color: var(--ink-2); font-size: 11.5px; letter-spacing: 0.03em; text-transform: uppercase; }
.res b { font-family: var(--font-display); font-size: 18px; font-variant-numeric: tabular-nums; }
.players { display: grid; gap: 5px; max-height: 250px; overflow: auto; padding-right: 2px; }
.p { display: grid; grid-template-columns: 30px 1fr auto; gap: 8px; align-items: center; padding: 4px 8px; border-radius: 8px; background: var(--panel-2); border: 2px solid transparent; }
.p.cur { border-color: var(--ink); }
.p.out { opacity: 0.4; }
.p.out .nm { text-decoration: line-through; }
.p img { width: 28px; height: 28px; display: block; }
.p .nm { font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.p .st { font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.p .st b { color: var(--ink); }
.cols { font-size: 12px; color: var(--ink-2); display: flex; justify-content: flex-end; gap: 10px; margin-top: -6px; }
details { border-top: 1px solid var(--line); padding-top: 10px; }
.stage details { border-top: 0; padding-top: 0; }
summary { cursor: pointer; font-family: var(--font-display); font-weight: 800; }
.form { display: grid; gap: 10px; margin-top: 10px; }
.row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
.row[hidden] { display: none; }
.row select { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; max-width: 190px; }
.range { display: grid; gap: 4px; }
.range .top { display: flex; justify-content: space-between; }
.range input { width: 100%; }
.log { list-style: none; margin: 0; padding: 0; max-height: 210px; overflow: auto; display: grid; gap: 4px; font-size: 13.5px; }
.log li { display: grid; grid-template-columns: 10px 1fr; gap: 8px; align-items: baseline; }
.log li i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.log li span { white-space: pre-line; }
.log li.sys { color: var(--ink-2); }
.log li.rnd { display: flex; align-items: center; gap: 8px; color: var(--ink-2); font-weight: 700; font-size: 12px; margin: 6px 0; }
.log li.rnd i { display: none; }
.log li.rnd::before, .log li.rnd::after { content: ''; flex: 1; border-top: 1px solid var(--line); }
.over { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(10, 16, 22, 0.55); }
.over[hidden] { display: none; }
.over > div { background: var(--panel); border-radius: 14px; padding: 22px 26px; text-align: center; display: grid; gap: 12px; border: 1px solid var(--line); max-width: 90%; justify-items: center; }
.over h3 { font-family: var(--font-display); font-size: 28px; margin: 0; }
.over img { width: 72px; height: 72px; }
.note { font-size: 12.5px; color: var(--ink-2); margin: 8px 0 0; }
.how { margin: 10px 0 0; padding-left: 18px; display: grid; gap: 6px; font-size: 13.5px; }
.how h4 { margin: 8px 0 0; font-family: var(--font-display); font-size: 14px; list-style: none; margin-left: -18px; }
.how li.h { list-style: none; margin-left: -18px; font-family: var(--font-display); font-weight: 800; padding-top: 6px; }
.guide { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; margin-top: 10px; }
.g { display: grid; grid-template-columns: 26px 1fr; gap: 8px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; }
.g .sw { width: 26px; height: 26px; border-radius: 7px; border: 1px solid rgba(0, 0, 0, 0.35); }
.g .nm { font-weight: 700; font-size: 13.5px; }
.g .ds { font-size: 12.5px; color: var(--ink-2); }
table.ut { border-collapse: collapse; width: 100%; font-size: 13px; margin-top: 10px; }
table.ut th, table.ut td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; }
table.ut th { background: var(--panel-2); }
.tblwrap { overflow-x: auto; }
/* selection card */
.card { display: grid; gap: 10px; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--panel-2); min-width: 0; }
.card[hidden] { display: none; }
.card .hd { display: flex; align-items: center; gap: 10px; min-width: 0; }
.card .hd img { width: 34px; height: 34px; flex: none; }
.card .hd .t { font-family: var(--font-display); font-weight: 800; font-size: 17px; min-width: 0; }
.card .hd .kw { font-size: 12.5px; font-weight: 400; color: var(--ink-2); font-family: inherit; }
[data-avp] { cursor: pointer; }
.avp { width: 22px; height: 22px; border-radius: 50%; vertical-align: middle; margin-right: 5px; }
.nmface { width: 18px; height: 18px; border-radius: 50%; vertical-align: -4px; margin-right: 4px; }
.avh { margin: 14px 0 6px; font-size: 13px; }
.avgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
.avo { display: grid; justify-items: center; gap: 4px; padding: 6px; border: 1px solid rgba(120,130,125,.4); border-radius: 10px; background: transparent; color: inherit; font: inherit; font-size: 12px; cursor: pointer; }
.avo img { width: 52px; height: 52px; border-radius: 50%; }
.avo.used { opacity: .4; cursor: not-allowed; }
.avo.on { outline: 2px solid #4363d8; }
.mbox[data-kind="naming"] { width: min(1000px, 100%); height: min(780px, 100%); }
.spw h4 { margin: 22px 0 4px; font-size: 13px; }
.spg { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px 14px; margin-top: 8px; }
.spc { display: flex; gap: 10px; align-items: center; font-size: 12px; }
.spc svg { flex: none; border: 1px solid rgba(60,70,65,.25); border-radius: 8px; }
.spc b { display: block; font-size: 13px; }
.spc span { color: var(--ink-2); }
.ncw h4 { margin: 14px 0 4px; font-size: 13px; }
.ncg { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; max-width: 560px; }
.ncs { display: grid; justify-items: center; gap: 2px; font-size: 11px; color: var(--ink-2); }
.ncs i { width: 100%; height: 28px; border-radius: 6px; border: 1px solid rgba(60,70,65,.35); }
.avwin { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 16px; align-items: start; }
.avlist { display: grid; gap: 4px; }
.avrow { display: flex; align-items: center; gap: 8px; padding: 4px 6px; border: 1px solid transparent; border-radius: 9px; cursor: pointer; font-size: 12px; }
.avrow.on { border-color: #4363d8; background: rgba(67,99,216,.1); }
.avrow img { width: 34px; height: 34px; border-radius: 50%; flex: none; }
.avrow input { width: 3.8em; font: inherit; font-size: 14px; padding: 2px 5px; border: 1px solid rgba(120,130,125,.5); border-radius: 6px; background: transparent; color: inherit; }
.avrow span { color: var(--ink-2); white-space: nowrap; }
.avname { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.avname > img { width: 44px; height: 44px; border-radius: 50%; }
.avname input { width: 4em; font: inherit; padding: 3px 6px; border: 1px solid rgba(120,130,125,.5); border-radius: 6px; background: transparent; color: inherit; }
.nmbox textarea.bad { border-color: #d64545; }
.nmchk { display: grid; gap: 2px; margin-top: 4px; font-size: 12px; color: var(--ink-2); }
.nmbad { color: #d64545; }
.nmchip { display: inline-block; padding: 1px 9px; margin: 2px 3px 2px 0; border: 1px solid rgba(120,130,125,.45); border-radius: 999px; font-size: 13px; white-space: nowrap; }
.card .hd .nw { white-space: nowrap; }
.card .hd .s { font-size: 12.5px; color: var(--ink-2); }
.kv { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 12px; font-size: 13.5px; }
.kv span { color: var(--ink-2); }
.kv b { font-variant-numeric: tabular-nums; }
.kv .full { grid-column: 1 / -1; }
.warn { color: var(--bad); font-weight: 700; }
.ok { color: var(--good); font-weight: 700; }
.obtns { display: flex; flex-wrap: wrap; gap: 6px; }
.opsbody { display: flex; flex-wrap: wrap; gap: 6px; align-items: flex-start; }
.opsbody > * { flex: 1 1 100%; min-width: 0; }
.opsbody > .obtns { display: contents; }
.opsbody > .obtns > button { flex: none; }
.opsbody .buybtn { margin-left: auto; }
.mhx { border: 1px solid var(--line); background: var(--panel-2); color: var(--ink-2); border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap; flex: none; }
.mhx:hover { color: #c0392b; border-color: #c0392b; background: #fbe3df; }
.dnybox { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 14px; padding: 18px 22px; width: min(520px, 100%); box-shadow: 0 12px 40px rgba(0,0,0,.35); display: grid; gap: 10px; }
.dnybox h3 { margin: 0; font-size: 16px; color: #c0392b; }
.dnybox p { white-space: pre-line; margin: 0; font-size: 14px; line-height: 1.7; color: var(--ink-2); }
.dnybox p:empty { display: none; }
.dnybox .btn { padding: 6px 16px; white-space: nowrap; }
.dnybox .btn[data-tone="green"] { background: #1f8a52; border-color: #1f8a52; color: #fff; }
.dnybox .btn[data-tone="red"] { background: #c0392b; border-color: #c0392b; color: #fff; }
.dnybox .btn[data-tone="orange"] { background: #d9730d; border-color: #d9730d; color: #fff; }
.dnybox .btn[data-tone]:hover { filter: brightness(1.08); }
.dnybtns { display: flex; justify-content: flex-end; gap: 10px; }
.hb-end.warn { background: #d9730d; }
.obtns button { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border: 1px solid var(--line); background: var(--panel); border-radius: 9px; cursor: pointer; font-weight: 700; font-size: 13.5px; color: var(--ink); }
.obtns button[aria-pressed="true"] { background: var(--btn); color: var(--btn-ink); }
.obtns button:disabled { opacity: 0.4; cursor: default; }
.olabel { font-size: 12px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-2); margin-bottom: -4px; }
.sub { font-size: 12.5px; color: var(--ink-2); }
.pv { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pv > div { background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 6px 8px; font-size: 13px; min-width: 0; }
.pv b { font-variant-numeric: tabular-nums; }
.pv .ttl { font-size: 11.5px; color: var(--ink-2); text-transform: uppercase; letter-spacing: 0.03em; display: block; }
.stepper { display: flex; align-items: center; gap: 8px; }
.stepper input[type=range] { flex: 1; min-width: 0; }
.stepper output { min-width: 3ch; text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.pend { margin: 0; padding: 0; list-style: none; display: grid; gap: 3px; font-size: 13px; }

/* directory sidebar: a collapsible strip on the left edge of the map; opened it covers part of the map and scrolls inside */
.dir { position: absolute; left: 0; top: 0; bottom: 0; z-index: 6; display: flex; }
.dirtab { width: 26px; border: 0; background: var(--panel); color: var(--ink-2); writing-mode: vertical-rl; letter-spacing: 0.3em; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; padding: 0; }
.dir[data-open="1"] .dirtab { color: var(--ink); background: var(--panel-2); }
.dirbody { display: none; width: 296px; min-height: 0; flex-direction: column; background: var(--panel); border-right: 1px solid var(--line); box-shadow: 4px 0 14px rgba(0,0,0,0.25); }
.dir[data-open="1"] .dirbody { display: flex; }
.dirmode { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 8px 8px 4px; }
.dirmode button { border: 1px solid var(--line); background: var(--panel-2); color: var(--ink); border-radius: 8px; padding: 5px; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; }
.dirmode button[aria-pressed="true"] { background: var(--btn); color: var(--btn-ink); }
.lflt { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 8px 8px 6px; border-bottom: 1px solid var(--line); }
.lflt { grid-auto-rows: 30px; align-items: center; }
.lflt select, .lflt input[type=search] { box-sizing: border-box; height: 30px; }
.lflt .chk { display: flex; align-items: center; gap: 5px; font-size: 12.5px; white-space: nowrap; }
.lflt select, .lflt input[type=search] { min-width: 0; font: inherit; font-size: 12.5px; padding: 3px 4px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel-2); color: var(--ink); }
.lflt input[type=search] { grid-column: 1 / -1; }
.dirflt { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px 8px 6px; border-bottom: 1px solid var(--line); }
.dirflt .chk { display: flex; align-items: center; gap: 5px; font-size: 12.5px; white-space: nowrap; }
.dirflt select, .dirflt input[type=search] { min-width: 0; font: inherit; font-size: 12.5px; padding: 3px 4px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel-2); color: var(--ink); }
.dirflt input[type=search] { grid-column: 1 / -1; }
.dirtree { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 0 8px; font-size: 12.5px; }
.dr, .dg { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; padding: 2px 8px; cursor: pointer; white-space: nowrap; }
.dr > .x, .dg > .x { color: var(--ink-2); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; margin-left: auto; }
.dg { font-weight: 700; }
.dg i, .dr i { font-style: normal; width: 12px; flex: none; color: var(--ink-2); }
.dr i { opacity: .55; }
.dr .dc1 { display: inline-block; text-align: center; }
.dr .dn { flex: 1; overflow: hidden; text-overflow: ellipsis; }
.dg .dgo { flex: 1; overflow: hidden; text-overflow: ellipsis; }
.dr:hover, .dg:hover { background: var(--panel-2); }
.l1 { padding-left: 8px; } .l2 { padding-left: 26px; } .l3 { padding-left: 44px; }
.nm { font: inherit; font-weight: 800; color: inherit; background: transparent; border: 0; border-bottom: 1px dashed var(--ink-2); padding: 0; cursor: text; text-align: left; }
.ren { font: inherit; font-weight: 800; width: 100%; max-width: 220px; border: 1px solid var(--ink); border-radius: 6px; padding: 1px 4px; background: var(--panel); color: var(--ink); }
.hist { font-size: 12px; color: var(--ink-2); }
.hist summary { cursor: pointer; font-weight: 400; }
.blk.sel { overflow-y: auto; }
.mbody { overflow: auto; }
.hmain, .hnav { overflow: auto; }


/* the right-hand dock: three panes (panel, index, battle log), exactly one showing; the end-turn button stays at the bottom */
.dock { grid-template-rows: auto minmax(0, 1fr); }
.hgrp { display: flex; align-items: center; gap: 2px; padding: 3px; border: 1px solid var(--line); border-radius: 11px; background: var(--panel-2); }
.hgrp .hround { padding: 0 8px 0 6px; margin: 0; }
.hb { font: inherit; font-size: 13.5px; font-weight: 700; padding: 5px 12px; border: 0; border-radius: 8px; background: transparent; color: var(--ink); cursor: pointer; white-space: nowrap; }
